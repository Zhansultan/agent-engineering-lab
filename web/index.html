<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harness - Phase A.3</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --primary: #0f3460;
      --accent: #e94560;
      --text: #eaeaea;
      --text-dim: #a0a0a0;
      --mock: #ffc107;
      --success: #4caf50;
      --error: #f44336;
      --tool: #9c27b0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Consolas', 'Monaco', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      padding: 1rem 2rem;
      border-bottom: 2px solid var(--primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .mode-toggle {
      display: flex;
      gap: 0.5rem;
    }

    .mode-btn {
      padding: 0.5rem 1rem;
      border: 2px solid var(--primary);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      border-radius: 4px;
      font-family: inherit;
    }

    .mode-btn.active {
      background: var(--primary);
      border-color: var(--accent);
    }

    .mode-btn.mock.active { border-color: var(--mock); }
    .mode-btn.ollama.active { border-color: var(--success); }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      padding: 1rem;
      max-height: calc(100vh - 80px);
    }

    .panel {
      background: var(--surface);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      background: var(--primary);
      padding: 0.75rem 1rem;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
    }

    #messages { display: flex; flex-direction: column; gap: 0.75rem; }

    .message {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      max-width: 90%;
    }

    .message.user {
      background: var(--primary);
      align-self: flex-end;
    }

    .message.assistant {
      background: #2d3748;
      align-self: flex-start;
    }

    .message.assistant.mock { border-left: 3px solid var(--mock); }
    .message.error { background: rgba(244, 67, 54, 0.2); border-left: 3px solid var(--error); }

    .message-meta {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 0.5rem;
    }

    /* Tool steps */
    .tool-step {
      background: rgba(156, 39, 176, 0.15);
      border-left: 3px solid var(--tool);
      padding: 0.5rem 0.75rem;
      margin: 0.25rem 0;
      border-radius: 4px;
      font-size: 0.85rem;
    }

    .tool-step .tool-name {
      color: var(--tool);
      font-weight: bold;
    }

    .tool-step .tool-args {
      color: var(--text-dim);
      font-size: 0.8rem;
    }

    .tool-result {
      background: rgba(76, 175, 80, 0.15);
      border-left: 3px solid var(--success);
      padding: 0.5rem 0.75rem;
      margin: 0.25rem 0;
      border-radius: 4px;
      font-size: 0.85rem;
    }

    .tool-result.error {
      background: rgba(244, 67, 54, 0.15);
      border-left-color: var(--error);
    }

    .tool-result pre {
      margin-top: 0.25rem;
      font-size: 0.8rem;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 150px;
      overflow-y: auto;
    }

    /* Input */
    .input-area {
      padding: 1rem;
      background: var(--primary);
      display: flex;
      gap: 0.5rem;
    }

    #messageInput {
      flex: 1;
      padding: 0.75rem 1rem;
      border: none;
      border-radius: 4px;
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
    }

    #messageInput:focus { outline: 2px solid var(--accent); }

    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 4px;
      background: var(--accent);
      color: white;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--text-dim);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Events */
    #events { font-size: 0.85rem; }

    .event {
      padding: 0.5rem;
      border-bottom: 1px solid var(--primary);
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.5rem;
    }

    .event-stage {
      background: var(--primary);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 0.75rem;
    }

    .event-data { color: var(--text-dim); word-break: break-all; }
    .event-time { color: var(--text-dim); font-size: 0.75rem; }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Harness <span style="font-size: 0.9rem; color: var(--text-dim);">Phase A.3</span></h1>
    <div class="mode-toggle">
      <button class="mode-btn mock active" data-mode="mock">Mock</button>
      <button class="mode-btn ollama" data-mode="ollama">Ollama</button>
    </div>
  </header>

  <main>
    <div class="panel">
      <div class="panel-header">
        Chat
        <button id="clearChat" style="padding: 0.3rem 0.75rem; font-size: 0.8rem;">Clear</button>
      </div>
      <div class="panel-content" id="messages"></div>
      <div class="input-area">
        <input type="text" id="messageInput" placeholder="Enter message... (Enter to send)" autofocus />
        <button id="sendBtn">Send</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        Events
        <button id="refreshEvents" style="padding: 0.3rem 0.75rem; font-size: 0.8rem;">Refresh</button>
      </div>
      <div class="panel-content" id="events"></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
